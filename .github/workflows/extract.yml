name: Extract zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            unzip -q -o "$z" -d _x
            rsync -a --exclude='.github' _x/*/ ./
            rm -rf _x "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract zip"
          git push
